<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dayli - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#ffe172","outline": "#7d7765","on-tertiary": "#ffffff","surface": "#fff9e9",
                      "primary": "#705d00","on-primary": "#ffffff","tertiary-fixed": "#faddc6","surface-dim": "#dfdaca",
                      "on-tertiary-fixed": "#27180b","on-surface": "#1d1c12","on-surface-variant": "#4c4637",
                      "inverse-surface": "#333026","secondary": "#546348","error-container": "#ffdad6","tertiary": "#6f5a49",
                      "inverse-on-surface": "#f6f0e1","primary-fixed-dim": "#e1c559","surface-container-low": "#f9f3e3",
                      "on-primary-container": "#715e00","surface-tint": "#705d00","on-secondary-container": "#58674c",
                      "surface-container-highest": "#e8e2d3","on-tertiary-container": "#705b49",
                      "on-secondary-fixed-variant": "#3c4b32","on-tertiary-fixed-variant": "#564332",
                      "on-background": "#1d1c12","on-error": "#ffffff","surface-bright": "#fff9e9",
                      "outline-variant": "#cec6b1","inverse-primary": "#e1c559","secondary-fixed-dim": "#bbccab",
                      "background": "#fff9e9","primary-container": "#f6d96b","surface-container-high": "#eee8d8",
                      "surface-container-lowest": "#ffffff","on-secondary": "#ffffff","on-primary-fixed-variant": "#544600",
                      "surface-container": "#f3eede","tertiary-container": "#f2d5bf","on-error-container": "#93000a",
                      "tertiary-fixed-dim": "#ddc2ac","error": "#ba1a1a","secondary-container": "#d4e5c3",
                      "on-primary-fixed": "#221b00","secondary-fixed": "#d7e8c6","on-secondary-fixed": "#121f0a",
                      "surface-variant": "#e8e2d3"
              },
              "borderRadius": {"DEFAULT": "0.25rem","lg": "0.5rem","xl": "0.75rem","full": "9999px"},
              "spacing": {"container-padding": "20px","xs": "4px","lg": "24px","sm": "8px","gutter": "16px","xl": "32px","unit": "4px","md": "16px"},
              "fontFamily": {
                      "label-md": ["Be Vietnam Pro"],"body-md": ["Be Vietnam Pro"],"body-lg": ["Be Vietnam Pro"],
                      "label-sm": ["Be Vietnam Pro"],"headline-lg-mobile": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],"headline-lg": ["Plus Jakarta Sans"],"display": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                      "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                      "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                      "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                      "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                      "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
              }
      },
          },
        }
    </script>
<style>
        body { background-color: theme('colors.surface'); color: theme('colors.on-surface'); -webkit-font-smoothing: antialiased; }
        .soft-shadow { box-shadow: 0px 4px 12px rgba(74, 56, 40, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-container-padding">
<div class="w-full max-w-md mx-auto mb-12 flex items-center justify-center gap-2">
<div class="h-2 w-2 rounded-full bg-secondary-fixed"></div>
<div class="h-2 w-2 rounded-full bg-secondary-fixed"></div>
<div class="h-2 w-2 rounded-full bg-secondary-fixed"></div>
<div class="h-2 w-8 rounded-full bg-secondary"></div>
</div>

<main class="w-full max-w-md bg-surface-container-lowest rounded-xl soft-shadow p-6 md:p-8 flex flex-col gap-lg">
<header class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">What do you enjoy doing?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Pick a few — Dayli will build these into your daily plan.</p>
</header>

<form class="flex flex-col gap-md" method="POST" action="{{ url_for('onboarding.step', step_name='activities') }}">
<div class="flex flex-col gap-sm">
<label class="relative flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="sr-only peer" name="preferred_activities" type="checkbox" value="gym"/>
<div class="w-5 h-5 border-2 border-outline rounded-full peer-checked:bg-secondary peer-checked:border-secondary flex items-center justify-center mr-4 transition-colors">
<span class="material-symbols-outlined text-[14px] text-surface-container-lowest opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Gym / strength training</span>
</label>
<label class="relative flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="sr-only peer" name="preferred_activities" type="checkbox" value="walking"/>
<div class="w-5 h-5 border-2 border-outline rounded-full peer-checked:bg-secondary peer-checked:border-secondary flex items-center justify-center mr-4 transition-colors">
<span class="material-symbols-outlined text-[14px] text-surface-container-lowest opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Walking</span>
</label>
<label class="relative flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="sr-only peer" name="preferred_activities" type="checkbox" value="meditation"/>
<div class="w-5 h-5 border-2 border-outline rounded-full peer-checked:bg-secondary peer-checked:border-secondary flex items-center justify-center mr-4 transition-colors">
<span class="material-symbols-outlined text-[14px] text-surface-container-lowest opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Meditation</span>
</label>
<label class="relative flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="sr-only peer" name="preferred_activities" type="checkbox" value="better_sleep_routine"/>
<div class="w-5 h-5 border-2 border-outline rounded-full peer-checked:bg-secondary peer-checked:border-secondary flex items-center justify-center mr-4 transition-colors">
<span class="material-symbols-outlined text-[14px] text-surface-container-lowest opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface">A better sleep routine</span>
</label>
<label class="relative flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="sr-only peer" name="preferred_activities" type="checkbox" value="journaling"/>
<div class="w-5 h-5 border-2 border-outline rounded-full peer-checked:bg-secondary peer-checked:border-secondary flex items-center justify-center mr-4 transition-colors">
<span class="material-symbols-outlined text-[14px] text-surface-container-lowest opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Journaling</span>
</label>
</div>

<div class="mt-sm">
<label class="font-label-md text-label-md text-tertiary mb-xs block">Something else you enjoy?</label>
<input name="preferred_activities_other" type="text" class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-md py-sm font-body-md text-body-md text-on-surface transition-colors" placeholder="Type your own activity"/>
</div>

<div class="mt-lg flex flex-col gap-sm">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-3 rounded-full hover:opacity-90 transition-opacity flex justify-center items-center gap-2" type="submit">
                    Create my day
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</main>

<script>
document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', function() {
        const label = this.closest('label');
        if (this.checked) {
            label.classList.add('bg-secondary-container/30', 'border-secondary/50');
            label.classList.remove('border-outline-variant/30');
        } else {
            label.classList.remove('bg-secondary-container/30', 'border-secondary/50');
            label.classList.add('border-outline-variant/30');
        }
    });
});
</script>
</body></html>
